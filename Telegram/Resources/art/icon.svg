<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Lumigram app icon: a speech bubble drawn as a glowing ring on a
       night tile. icon_small.svg is the same icon tuned for 32 px and
       below. Telegram/build/app_icons.ps1 renders both into the PNG and
       ICO files next to them. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D2350"/>
      <stop offset="1" stop-color="#0E1230"/>
    </linearGradient>
    <radialGradient id="sky" cx=".3" cy=".12" r=".8">
      <stop offset="0" stop-color="#7C8CFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FF0D6"/>
      <stop offset=".55" stop-color="#6FA2FF"/>
      <stop offset="1" stop-color="#C77DFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <path id="bubble" d="M512 196C700 196 836 322 836 488C836 654 700 780 512 780C470 780 431 774 395 762L262 826C246 834 228 819 234 802L266 702C219 652 188 574 188 488C188 322 324 196 512 196Z"/>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="236" fill="url(#night)"/>
  <rect x="72" y="72" width="880" height="880" rx="236" fill="url(#sky)"/>
  <rect x="76" y="76" width="872" height="872" rx="232" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="8"/>
  <g transform="translate(512 500) scale(.82) translate(-512 -500)">
    <use href="#bubble" fill="none" stroke="url(#neon)" stroke-width="110" filter="url(#glow)" opacity=".75"/>
    <use href="#bubble" fill="none" stroke="url(#neon)" stroke-width="78" stroke-linejoin="round"/>
  </g>
</svg>
